name: Validate starter

on:
  pull_request:
  push:
    branches: [main, "feat/decisions-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AZURE_OPENAI_LIVE_TESTS: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/typescript/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: "src/go/**/go.sum"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: Azure/setup-azd@v2
      - name: Restore sample dependencies
        run: |
          python -m pip install -r src/python/requirements.txt
          npm ci --prefix src/typescript
          for directory in src/go/*; do
            (
              cd "$directory"
              go mod tidy -diff
              unformatted="$(gofmt -l main.go)"
              if [ -n "$unformatted" ]; then
                echo "Run gofmt in $directory: $unformatted" >&2
                exit 1
              fi
            )
          done
          (
            cd src/ruby
            bundle config set --local path vendor/bundle
            bundle config set --local frozen true
            bundle install
          )
      - name: Validate infrastructure and offline contracts
        run: |
          bash validate.sh
          python -m unittest discover -s tests -v
          git diff --exit-code
